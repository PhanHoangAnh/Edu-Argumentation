# /etc/nginx/sites-available/foxai-edu-study-public.conf  (symlinked in sites-enabled)
# Repo copy: ml/study/Edu-Argumentation/deploy/nginx-edu-study-public.conf — keep the two identical.
#
# 23-09-26 (user-authorised): the study app (foxai-edu-study) on the PUBLIC IP
# https://160.30.252.66/ — no domain name. Report:
# process/features/ml/active/edu-replatform_21-09-26/public-ip-access_REPORT_23-09-26.md
#
# ⚠ This is the 443 default_server. Before it there was none, so a bare-IP HTTPS request fell back
#   to the first 443 block (CoreX PROD). Name-based sites (foxcorex.foxai.com.vn, ehc.foxai.com.vn)
#   are matched by server_name/SNI first and are NOT affected.
# ⚠ Self-signed certificate for IP SAN 160.30.252.66 (/etc/foxai/tls/edu-study-ip.{crt,key}).
#   Browsers show a warning once; HSTS is deliberately OFF — HSTS on a self-signed IP would make the
#   warning un-clickable-through.
# ⚑ 24-09-26 (P6b cutover): the upstream moved 127.0.0.1:8792 -> 127.0.0.1:8767 with the app itself.
#   :8792 is retired (nothing listens). Backup of the pre-cutover conf: nn:~/backups/edu-cutover-20260924T062144Z/
# ⚠ Proxied: the study app (:8767), Lab (/lab/ -> :8798, since 24-09-26) and the importer (/importer/ -> :8769, since 27-09-26). 9router (:20128) is NOT reachable through this block.
#
# The app trusts X-Real-IP / X-Forwarded-For / X-Forwarded-Proto ONLY from a loopback peer
# (app/backend/main.py client_ip / _via_https). $remote_addr is set here, never appended to a
# client-supplied chain, so a client cannot inject a hop.
#
# Rollback: sudo rm /etc/nginx/sites-enabled/foxai-edu-study-public.conf && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 160.30.252.66 _;

    ssl_certificate     /etc/foxai/tls/edu-study-ip.crt;
    ssl_certificate_key /etc/foxai/tls/edu-study-ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/edu-study-public.access.log;
    error_log  /var/log/nginx/edu-study-public.error.log;

    # The app's largest body cap is /api/exercise/grade at 96 KB; the app refuses anything over its
    # per-route cap itself. 100k leaves headroom for headers without admitting uploads.
    client_max_body_size 100k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ⚑ 24-09-26 (ruling R27, plan D2): Lab — the separate foxai-edu-lab service on 127.0.0.1:8798.
    #   Same forwarded headers as `location /`. proxy_pass has NO URI, so the /lab/ prefix is passed
    #   through unchanged (Lab mounts its routes under /lab literally). ⚑ 25-09-26: this location now
    #   carries its own three headers (see inside) — an inner add_header drops the server-level ones.
    #   Body cap 300k: Lab refuses anything over 256 KB itself (413). Read timeout 100 s: the runner
    #   answers within 80 s and Lab waits at most 90 s.
    #   Rollback: remove these two locations, nginx -t, reload — /lab/ then falls to the study app.
    location = /lab {
        return 301 /lab/;
    }

    location /lab/ {
        # ⚑ 25-09-26: the study app frames Lab beside the lesson (same origin here). An add_header in a
        #   location DROPS every server-level one, so all three are restated; only X-Frame-Options
        #   differs (SAMEORIGIN, not DENY). Lab's own CSP frame-ancestors 'self' is the modern control.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        proxy_pass http://127.0.0.1:8798;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 300k;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_connect_timeout 10s;
    }

    # ⚑ 27-09-26 (user-authorised): the document importer — foxai-edu-importer on 127.0.0.1:8769.
    #   proxy_pass WITH a trailing "/" STRIPS the /importer/ prefix: the importer serves at / and its
    #   page uses relative URLs (api/..., js/...), so it works unchanged under the prefix.
    #   X-Forwarded-Prefix tells it to send anonymous visitors to the same-origin /login?next=/importer/
    #   (the importer accepts any signed-in study account). Server-level headers are inherited (no
    #   add_header here). Body cap 120m = the importer's MAX_UPLOAD_BYTES; uploads stream unbuffered.
    #   Rollback: remove these two locations, nginx -t, reload — the importer is then VPN-only again.
    location = /importer {
        return 301 /importer/;
    }

    location /importer/ {
        proxy_pass http://127.0.0.1:8769/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Prefix /importer;

        client_max_body_size 120m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-safe (the app uses none today; harmless if it ever does).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_edu;

        # SSE / streamed tutor answers: no buffering, and room for the tutor's 120 s ceiling.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
    }
}

map $http_upgrade $connection_upgrade_edu {
    default upgrade;
    ''      '';
}

# Port 80, bare IP ONLY -> HTTPS. The existing `default` port-80 server (and every named site) is
# untouched: this block matches Host: 160.30.252.66 and nothing else.
server {
    listen 80;
    listen [::]:80;
    server_name 160.30.252.66;
    return 301 https://160.30.252.66$request_uri;
}
